<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ReconAI Enterprise</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-glow-orb-1"></div>
  <div class="auth-glow-orb-2"></div>

  <div class="auth-card-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html">
          <img src="assets/logo.svg" alt="ReconAI Logo" class="auth-brand-logo">
        </a>
        <h2>Welcome Back</h2>
        <p>Sign in to access your financial reconciliation workspace</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Work Email</label>
          <input type="email" id="email" class="form-input" placeholder="finance.controller@enterprise.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-recon btn-recon-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
          <i class="bi bi-box-arrow-in-right"></i> Sign In to Platform
        </button>
      </form>

      <!-- Quick Demo Credentials Box -->
      <div class="demo-credentials-box">
        <strong>Demo Controller Account:</strong>
        <div style="margin-top: 2px;">Email: <code>admin@finance.ai</code> | Pwd: <code>password123</code></div>
        <button type="button" onclick="fillDemoCredentials('admin@finance.ai', 'password123')">
          <i class="bi bi-magic"></i> Auto-fill Demo Credentials
        </button>
      </div>

      <div class="auth-footer-links">
        Don't have an account? <a href="register.html" style="font-weight: 600;">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Auth.checkAuthRedirect();

      const form = document.getElementById("login-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const submitBtn = document.getElementById("btn-login-submit");

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="bi bi-arrow-repeat spin"></i> Authenticating...`;

        try {
          await Auth.login(email, password);
          showToast("Authentication successful! Redirecting...", "success");
          setTimeout(() => window.location.href = "dashboard.html", 800);
        } catch (err) {
          showToast(err.message, "error");
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="bi bi-box-arrow-in-right"></i> Sign In to Platform`;
        }
      });
    });
  </script>
</body>
</html>
